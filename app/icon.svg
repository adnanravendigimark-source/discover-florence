<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C84830" />
      <stop offset="50%" stop-color="#B33D26" />
      <stop offset="100%" stop-color="#8E2A16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA68" />
      <stop offset="50%" stop-color="#D49B3D" />
      <stop offset="100%" stop-color="#B0751D" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#401006" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#terracottaGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />

  <!-- Duomo Florence Brunelleschi's Dome in Golden & Ivory Line Art -->
  <g transform="translate(8, 8)" filter="url(#subtleShadow)">
    <!-- Lantern Cross & Finial -->
    <rect x="23" y="3" width="2" height="7" rx="0.5" fill="url(#goldGrad)" />
    <rect x="20.5" y="5" width="7" height="2" rx="0.5" fill="url(#goldGrad)" />
    <!-- Lantern Sphere & Cupola -->
    <circle cx="24" cy="11.5" r="3" fill="url(#goldGrad)" />
    <path d="M20 14.5 H28 L29.5 19 H18.5 Z" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Dome Ribbed Profile -->
    <path d="M24 19 C18 20.5 11 27 8 38 H40 C37 27 30 20.5 24 19 Z" fill="#FAF6EE" />
    
    <!-- Terracotta Shading & Dome Ribs -->
    <path d="M24 19 C20.5 24 17.5 30.5 15.5 38 H24 Z" fill="#E8A89A" fill-opacity="0.3" />
    <path d="M24 19 C24 25.5 24 32 24 38" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M24 19 C19.5 23.5 16 30.5 13.5 38" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M24 19 C28.5 23.5 32 30.5 34.5 38" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Marble Drum with Oculi -->
    <rect x="7" y="38" width="34" height="6.5" rx="0.8" fill="url(#goldGrad)" />
    <circle cx="12.5" cy="41.25" r="1.6" fill="#6B1D0E" />
    <circle cx="18.25" cy="41.25" r="1.6" fill="#6B1D0E" />
    <circle cx="24" cy="41.25" r="1.6" fill="#6B1D0E" />
    <circle cx="29.75" cy="41.25" r="1.6" fill="#6B1D0E" />
    <circle cx="35.5" cy="41.25" r="1.6" fill="#6B1D0E" />

    <!-- Cathedral Base -->
    <rect x="4" y="44.5" width="40" height="3" rx="0.5" fill="#FAF6EE" />
  </g>
</svg>
